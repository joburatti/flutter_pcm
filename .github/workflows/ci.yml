name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 cmake ninja-build pkg-config libgtk-3-dev libpulse-dev \
            pipewire pipewire-pulse wireplumber pulseaudio-utils \
            dbus-user-session xvfb
          # Flutter builds with plain clang++. The default clang 18 can't use
          # std::expected from the installed libstdc++ 14.
          mkdir -p "$RUNNER_TEMP/clang"
          ln -s /usr/bin/clang-19 "$RUNNER_TEMP/clang/clang"
          ln -s /usr/bin/clang++-19 "$RUNNER_TEMP/clang/clang++"
          echo "$RUNNER_TEMP/clang" >> "$GITHUB_PATH"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Analyze
        run: |
          flutter pub get
          flutter analyze
          cd example
          flutter pub get
          flutter analyze

      - name: Widget test
        working-directory: example
        run: flutter test

      # The runner has no login session and no sound card. Start a user
      # systemd manager (the test restarts PipeWire with systemctl --user) and
      # give PipeWire a null sink. The sink is configured in a file rather
      # than loaded with pactl, so it comes back when the test restarts the
      # server.
      - name: Start PipeWire
        run: |
          mkdir -p ~/.config/pipewire/pipewire.conf.d
          cat > ~/.config/pipewire/pipewire.conf.d/ci-null-sink.conf <<'EOF'
          context.objects = [
            { factory = adapter
              args = {
                factory.name     = support.null-audio-sink
                node.name        = "ci-sink"
                node.description = "CI null sink"
                media.class      = Audio/Sink
                audio.position   = [ FL FR ]
                audio.rate       = 48000
                object.linger    = true
                monitor.channel-volumes = true
              }
            }
          ]
          EOF
          sudo loginctl enable-linger "$USER"
          runtime_dir="/run/user/$(id -u)"
          for i in $(seq 50); do
            [ -S "$runtime_dir/bus" ] && break
            sleep 0.2
          done
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$runtime_dir"
          systemctl --user daemon-reload
          systemctl --user start pipewire pipewire-pulse wireplumber
          for i in $(seq 50); do
            pactl info >/dev/null 2>&1 && break
            sleep 0.2
          done
          pactl info
          pactl list short sinks

      - name: Integration test
        working-directory: example
        run: xvfb-run -a flutter test integration_test/linux_playback_test.dart -d linux

      - name: PipeWire logs
        if: failure()
        run: journalctl --user -n 100 --no-pager -u pipewire -u pipewire-pulse -u wireplumber || true

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build APK
        working-directory: example
        run: flutter build apk --debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator keeps audio enabled (the default options include
      # -noaudio). The host has no sound server, so QEMU plays into a null
      # backend.
      - name: Integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: example
          script: flutter test integration_test/android_playback_test.dart -d emulator-5554

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The runner has no audio endpoint. This installs the VB-CABLE virtual
      # sound card.
      - uses: LABSN/sound-ci-helpers@v1.0.4

      - name: Start Windows Audio
        shell: pwsh
        run: |
          Set-Service Audiosrv -StartupType Automatic
          Start-Service Audiosrv
          Get-Service Audiosrv, AudioEndpointBuilder
          Get-CimInstance Win32_SoundDevice | Format-Table Name, Status

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Integration test
        working-directory: example
        run: flutter test integration_test/windows_playback_test.dart -d windows
